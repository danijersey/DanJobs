services:
  mysql:
    image: mysql:8.4
    container_name: DanJobs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: DanJobs
      MYSQL_USER: DanJobs
      MYSQL_PASSWORD: DanJobs
    ports:
      - "3307:3306"
    volumes:
      - DanJobs_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  DanJobs_data:
